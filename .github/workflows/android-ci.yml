name: Android CI

on:
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-ci.yml"

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: detekt
        run: ./gradlew detekt

      - name: Core module unit tests
        run: ./gradlew :core:test

      - name: App module unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Android Lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew assembleDebug

      # Exercises the R8/minified release build (unsigned — signing material
      # only exists in the release workflow) so shrinking rules can never
      # silently break without a release dispatch.
      - name: Assemble release APK (unsigned, R8)
        run: ./gradlew assembleRelease

  # 5.4: reproducible-build guard — the release APK must build byte-for-byte
  # identically twice in a row (fixed toolchain, no timestamps). A failure
  # means Obtainium/F-Droid-style reproducibility broke and must be fixed
  # before release.
  reproducible-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK twice
        run: |
          ./gradlew --no-daemon clean assembleRelease
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | tee build-a.txt
          ./gradlew --no-daemon clean assembleRelease
          sha256sum app/build/outputs/apk/release/app-release-unsigned.apk | tee build-b.txt

      - name: Compare checksums
        run: |
          if ! diff -u build-a.txt build-b.txt; then
            echo "::error::Release build is not reproducible"; exit 1
          fi
