name: Android Release

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from app/build.gradle.kts
        id: version
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "Could not read versionName from app/build.gradle.kts" >&2
            exit 1
          fi
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=libredirect-mobile-v$VERSION.apk" >> "$GITHUB_OUTPUT"

      - name: Check release tag does not already exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ steps.version.outputs.tag }} already exists. Bump versionName in app/build.gradle.kts first." >&2
            exit 1
          fi

      - name: Decode release keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore/release.keystore

      - name: Write local signing properties
        run: |
          cat >> local.properties <<EOF
          RELEASE_STORE_FILE=keystore/release.keystore
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Build signed release APK
        run: ./gradlew assembleRelease

      - name: Smoke test bundled manifest in release APK
        run: ./gradlew :core:test -PreleaseApk="$PWD/app/build/outputs/apk/release/app-release.apk"

      - name: Rename APK to release asset name
        run: |
          mkdir -p release-out
          cp "app/build/outputs/apk/release/app-release.apk" "release-out/${{ steps.version.outputs.apk_name }}"

      - name: Remove local signing material
        if: always()
        run: |
          rm -rf keystore
          rm -f local.properties

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "release-out/${{ steps.version.outputs.apk_name }}" \
            --repo "${{ github.repository }}" \
            --title "LibRedirect Mobile ${{ steps.version.outputs.tag }}" \
            --generate-notes
