style:
  MaxLineLength:
    maxLineLength: 120

naming:
  FunctionNaming:
    ignoreAnnotated:
      - Composable

complexity:
  TooManyFunctions:
    ignorePrivate: true
    thresholdInClasses: 12
  LongMethod:
    ignoreAnnotated:
      - Composable
  LongParameterList:
    ignoreAnnotated:
      - Composable
