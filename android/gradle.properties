org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AGP 9.0 flipped this default to true: "-keep class A" no longer implies
# keeping the default constructor, which stripped androidx's reflectively
# instantiated Room _Impl classes (WorkDatabase_Impl.<init>) and crashed the
# app at startup (InitializationProvider). Restore the AGP 8.13 semantics;
# re-enable only after androidx ships strict-full-mode-safe consumer rules.
android.r8.strictFullModeForKeepRules=false
